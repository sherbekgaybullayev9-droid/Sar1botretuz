databases:
  - name: stars-bot-db
    plan: free
    databaseName: stars_bot
    user: stars_bot

services:
  - type: web
    name: stars-tasks-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:flask_app -c gunicorn.conf.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: stars-bot-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      # Ixtiyoriy: Render avtomatik RENDER_EXTERNAL_URL beradi.
      # Maxsus domen ishlatsangiz shu yerga yozing (masalan https://bot.onrender.com)
      - key: WEBHOOK_URL
        sync: false
